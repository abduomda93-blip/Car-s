name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Locate Flutter project and prepare Android scaffold
        shell: bash
        run: |
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "Error: pubspec.yaml not found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"

          mkdir -p /tmp/carlog_backup
          cp pubspec.yaml /tmp/carlog_backup/pubspec.yaml
          [ -f lib/main.dart ] && cp lib/main.dart /tmp/carlog_backup/main.dart

          # Always regenerate a clean Android v2 embedding Gradle scaffold (wipes any legacy v1 embedding android/ folder)
          echo "Generating clean Android v2 embedding Gradle structure..."
          rm -rf android
          flutter create --platforms=android --org com.carlog --project-name car_log_app .
          rm -f test/widget_test.dart

          # Restore our custom pubspec.yaml and lib/main.dart
          cp /tmp/carlog_backup/pubspec.yaml pubspec.yaml
          mkdir -p lib
          [ -f /tmp/carlog_backup/main.dart ] && cp /tmp/carlog_backup/main.dart lib/main.dart

          # Ensure INTERNET & NETWORK permissions and Arabic label in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/' "$MANIFEST"
            fi
            sed -i 's/android:label="[^"]*"/android:label="سجل السيارات اليومي"/' "$MANIFEST"
          fi

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK (Release)
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: car-log-app-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
